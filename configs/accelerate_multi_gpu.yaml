# 此配置供两张 NVIDIA GPU 的单机训练使用；只有一张 GPU 时不要使用它。
compute_environment: LOCAL_MACHINE
# 调试模式关闭，减少正式训练日志噪音。
debug: false
# MULTI_GPU 表示在一台机器上使用多个 GPU 进程。
distributed_type: MULTI_GPU
# 不强制将 BF16 下转成其他精度。
downcast_bf16: "no"
# 默认不额外启用 CPU 绑核设置。
enable_cpu_affinity: false
# all 表示使用可见的全部 GPU；也可改成 "0,1"。
gpu_ids: all
# 单机训练时当前机器编号固定为 0。
machine_rank: 0
# Accelerate 启动的 Python 主函数名称。
main_training_function: main
# 支持 BF16 的显卡可使用 bf16；旧显卡改成 fp16。
mixed_precision: bf16
# 单机训练机器总数为 1。
num_machines: 1
# 两张 GPU 时进程数为 2；请按实际 GPU 数量修改。
num_processes: 2
# 单机进程会合时使用静态地址即可。
rdzv_backend: static
# 所有进程处于同一台机器和网络中。
same_network: true
# 本项目不使用 TPU 环境变量。
tpu_env: []
# 不使用 TPU 集群。
tpu_use_cluster: false
# 不开启 TPU sudo。
tpu_use_sudo: false
# false 表示使用 GPU 而不是强制 CPU。
use_cpu: false
