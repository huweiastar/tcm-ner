# 实验名称会显示在日志里，便于区分不同设置。
experiment_name: qwen2_5_7b_tcm_ner_lora
# 修改这一行即可替换为兼容聊天模板的其他基座/指令模型。
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
# lora 表示模型权重以 BF16/FP16 加载，只训练低秩适配器。
method: lora
# 官方 Qwen 仓库无需自定义远程代码，默认保持关闭更稳妥。
trust_remote_code: false

# 数据部分指定第一步预处理得到的文件路径。
data:
  # 训练集负责更新 LoRA 参数。
  train_file: processed_data/train.jsonl
  # 验证集负责观察 loss 并选择较好检查点。
  validation_file: processed_data/validation.jsonl
  # 测试集仅在训练结束后做最终 F1 报告。
  test_file: processed_data/test.jsonl

# LoRA 只给注意力投影层增加少量可训练参数，适合显存相对充足时使用。
lora:
  # r 越大可训练容量越高，同时占用更多显存。
  r: 16
  # alpha 控制 LoRA 更新量缩放，常取 r 的两倍。
  alpha: 32
  # dropout 可以缓解小数据集过拟合。
  dropout: 0.05
  # 对 Qwen2.5 的四个注意力线性层插入适配器。
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

# 训练参数可先使用默认值跑通，再基于验证集调优。
training:
  # 所有日志和 LoRA adapter 检查点保存到这里。
  output_dir: outputs/qwen2_5_7b_lora
  # 统一把样本最大 token 长度限制在 512；本数据原文最长仅约 151 字。
  max_length: 512
  # 初学实验先训练 3 轮。
  num_train_epochs: 3
  # LoRA 常用略高于全量微调的学习率。
  learning_rate: 0.0002
  # 单卡每一步放入的训练样本数；显存不足时减到 1。
  per_device_train_batch_size: 2
  # 验证时不保存梯度，可以尝试稍大的批大小。
  per_device_eval_batch_size: 2
  # 累积 8 步梯度，等效训练批大小为每卡 16。
  gradient_accumulation_steps: 8
  # 每隔多少个更新步骤打印一次训练损失。
  logging_steps: 10
  # 每隔多少个更新步骤在验证集上评价一次。
  eval_steps: 100
  # 每隔多少个更新步骤保存一次适配器检查点。
  save_steps: 100
  # 只保留最近两个检查点，防止硬盘被占满。
  save_total_limit: 2
  # 用 warmup 让训练开始阶段的学习率平滑上升。
  warmup_ratio: 0.03
  # 常见线性学习率下降策略。
  lr_scheduler_type: linear
  # 少量权重衰减可抑制过拟合。
  weight_decay: 0.01
  # 开启梯度检查点以显著降低激活显存。
  gradient_checkpointing: true
  # sdpa 是 PyTorch 内置高效注意力；安装 flash-attn 后可试验 flash_attention_2。
  attn_implementation: sdpa
  # 按样本长度分组可减少同一批次中的 padding 浪费。
  group_by_length: true
  # 验证 loss 连续若干次不改善时停止，减少明显过拟合和无效计算。
  early_stopping_patience: 3
  # loss 至少改善该数值才被视为有进步。
  early_stopping_threshold: 0.0
  # 优先尝试 NVIDIA Ampere 及更新显卡支持的 BF16。
  precision: bf16
  # 普通 LoRA 使用 PyTorch AdamW 优化器。
  optim: adamw_torch
  # 本教学版不默认向外部实验跟踪平台发送日志。
  report_to: none
  # 设置随机种子，方便重复实验。
  seed: 42
  # false 表示保持样本独立，最容易理解和检查输出。
  packing: false
  # 为空表示从头开始；也可填写某个 checkpoint 路径断点续训。
  resume_from_checkpoint: null

# 推理与评价参数由 evaluate_ner.py 读取，也可以在命令行临时覆盖。
generation:
  # 批量生成通常比逐条生成快；显存不足时改为 1。
  batch_size: 2
  # 第一次回答不是合法 JSON 时，自动追加一次格式纠错提问。
  retry_invalid_output: true
  # 限制每条实体答案生成长度。
  max_new_tokens: 256
  # 对最终 micro F1 进行重复抽样，估计 95% 置信区间。
  bootstrap_resamples: 1000
